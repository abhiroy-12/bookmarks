# Postgres profile (activate with SPRING_PROFILES_ACTIVE=postgres).
# Composes a JDBC URL from the individual parts Render exposes via fromDatabase,
# since Render's connection string is a postgres:// URL that the JDBC driver
# cannot consume directly.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
