spring.application.name=bookmarks

# Listen on the platform-provided port (Render injects PORT); 8080 locally.
server.port=${PORT:8080}

# Local/dev datasource (H2 in-memory). Activate the "postgres" profile for Postgres.
spring.datasource.url=${DB_URL:jdbc:h2:mem:bookmarks;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
