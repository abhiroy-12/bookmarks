spring.application.name=bookmarks

# Local/dev datasource (H2 in-memory). Override with env vars for Postgres in prod.
spring.datasource.url=${DB_URL:jdbc:h2:mem:bookmarks;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
